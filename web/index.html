<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/pages/index.css" />

  <title>Ndreqe</title>
</head>

<body>
  <header></header>
  <main>
    <section class="featured-professionals-section" aria-labelledby="featured-professionals-title">

      <div class="section-header">
        <h2 class="section-title" id="featured-professionals-title">
          Profesionistë të vlerësuar
        </h2>

        <a href="#all-professionals" class="view-all-link">
          Shiko të gjithë
          <span aria-hidden="true">&rarr;</span>
        </a>
      </div>

      <div class="professionals-grid">

        <article class="professional-card">
          <figure class="professional-profile-figure">
            <img src="./assets/div.png" alt="Foto e profesionistit">
          </figure>

          <div class="professional-details-header">
            <h3 class="professional-name">Arben Krasniqi</h3>
            <span class="verification-badge">
              <img src="./assets/icons/Vector.svg" alt="Tick icon">
              I verifikuar
            </span>
          </div>

          <p class="professional-service-location">
            Elektricist &middot; Prishtinë
          </p>

          <div class="professional-rating" aria-label="Vlerësimi 4.9 nga 5, bazuar në 128 vlerësime">
            <img src="./assets/icons/star.svg" alt="Rating Star">
            <span class="rating-score">4.9</span>
            <span class="rating-count">(128 vlerësime)</span>
          </div>

          <div class="professional-card-footer">
            <p class="professional-price">
              nga <data class="price-amount" value="15">15€</data>
            </p>

            <button class="professional-booking-button" type="button" aria-label="Rezervo Arben Krasniqin">
              Rezervo
            </button>
          </div>
        </article>

        <article class="professional-card">
          <figure class="professional-profile-figure">
            <img src="./assets/div.png" alt="Foto e profesionistit">
          </figure>

          <div class="professional-details-header">
            <h3 class="professional-name">Drita Berisha</h3>
            <span class="verification-badge">
              <img src="./assets/icons/Vector.svg" alt="Tick icon">
              E verifikuar
            </span>
          </div>

          <p class="professional-service-location">
            Pastrim &middot; Prizren
          </p>

          <div class="professional-rating" aria-label="Vlerësimi 5.0 nga 5, bazuar në 86 vlerësime">
            <img src="./assets/icons/star.svg" alt="Rating Star">
            <span class="rating-score">5.0</span>
            <span class="rating-count">(86 vlerësime)</span>
          </div>

          <div class="professional-card-footer">
            <p class="professional-price">
              nga <data class="price-amount" value="12">12€</data>
            </p>

            <button class="professional-booking-button" type="button" aria-label="Rezervo Drita Berishën">
              Rezervo
            </button>
          </div>
        </article>

        <article class="professional-card">
          <figure class="professional-profile-figure">
            <img src="./assets/div.png" alt="Foto e profesionistit">
          </figure>

          <div class="professional-details-header">
            <h3 class="professional-name">Faton Gashi</h3>
            <span class="verification-badge">
              <img src="./assets/icons/Vector.svg" alt="Tick icon">
              I verifikuar
            </span>
          </div>

          <p class="professional-service-location">
            Hidraulik &middot; Pejë
          </p>

          <div class="professional-rating" aria-label="Vlerësimi 4.8 nga 5, bazuar në 203 vlerësime">
            <img src="./assets/icons/star.svg" alt="Rating Star">
            <span class="rating-score">4.8</span>
            <span class="rating-count">(203 vlerësime)</span>
          </div>

          <div class="professional-card-footer">
            <p class="professional-price">
              nga <data class="price-amount" value="18">18€</data>
            </p>

            <button class="professional-booking-button" type="button" aria-label="Rezervo Faton Gashin">
              Rezervo
            </button>
          </div>
        </article>

      </div>
    </section>
  </main>
  <footer></footer>
</body>

</html>
