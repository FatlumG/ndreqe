<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/pages/index.css" />

    <title>Ndreqe</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="hero-section">
        <div class="hero-content">
          <h1>Çfarë prishet, ndreqet.</h1>
          <p>
            Gjej profesionistë të verifikuar për shtëpinë tënde dhe rezervo në
            pak minuta.
          </p>
          <div class="hero-filters">
            <div class="hero-filter">
              <img src="./assets/icons/search.svg" alt="Search icon" />
              <div class="filter-inputs">
                <label for="sherbimi">Sherbimi</label>
                <input
                  type="text"
                  name="sherbimi"
                  id="sherbimi"
                  placeholder="Çfarë të duhet?"
                />
              </div>
            </div>
            <div class="hero-filter">
              <img src="./assets/icons/location.svg" alt="Location icon" />
              <div class="filter-inputs">
                <label for="qyteti">Qyteti</label>
                <select name="qyteti" id="qyteti">
                  <option value="Prishtinë">Prishtinë</option>
                  <option value="Prizren">Prizren</option>
                  <option value="Pejë">Pejë</option>
                  <option value="Gjakovë">Gjakovë</option>
                  <option value="Mitrovicë">Mitrovicë</option>
                  <option value="Gjilan">Gjilan</option>
                  <option value="Ferizaj">Ferizaj</option>
                  <option value="Podujevë">Podujevë</option>
                  <option value="Vushtrri">Vushtrri</option>
                  <option value="Suharekë">Suharekë</option>
                  <option value="Rahovec">Rahovec</option>
                  <option value="Malishevë">Malishevë</option>
                  <option value="Drenas">Drenas</option>
                  <option value="Lipjan">Lipjan</option>
                  <option value="Kamenicë">Kamenicë</option>
                  <option value="Viti">Viti</option>
                  <option value="Skenderaj">Skenderaj</option>
                  <option value="Deçan">Deçan</option>
                  <option value="Istog">Istog</option>
                  <option value="Klinë">Klinë</option>
                  <option value="Fushë Kosovë">Fushë Kosovë</option>
                </select>
              </div>
            </div>
            <div class="hero-filter">
              <img src="./assets/icons/calendar.svg" alt="Calendar icon" />
              <div class="filter-inputs">
                <label for="sherbimi">Sherbimi</label>
                <input
                  type="date"
                  name="sherbimi"
                  id="sherbimi"
                  placeholder="Zgjidh ditën"
                />
              </div>
            </div>
            <button>Kërko</button>
          </div>
        </div>
        <div class="hero-image"></div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
