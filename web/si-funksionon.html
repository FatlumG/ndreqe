
<!DOCTYPE html>
<html lang="sq">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Si funksionon? | Ndreqe</title>

    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/pages/index.css">
</head>

<body>

    <main class="how-it-works-page">

        <section class="how-it-works-section">

            <div class="section-header">
                <h2>Si funksionon</h2>
                <p>Tre hapa për të gjetur shërbimin që të duhet.</p>
            </div>

            <div class="steps-container">

                <div class="step-card">
                    <div class="step-card-content">
                        <span class="step-number">1</span>
                        <h3>Zgjedh shërbimin</h3>
                        <p>
                            Shkruaj çfarë të duhet dhe krahaso profesionistët.
                        </p>
                    </div>
                </div>

                <div class="step-card">
                    <div class="step-card-content">
                        <span class="step-number">2</span>
                        <h3>Rezervo orarin</h3>
                        <p>
                            Zgjedh ditën dhe orën që të përshtatet.
                        </p>
                    </div>
                </div>

                <div class="step-card">
                    <div class="step-card-content">
                        <span class="step-number">3</span>
                        <h3>Puna kryhet</h3>
                        <p>
                            Profesionisti vjen në kohë dhe paguan pasi të përfundojë puna.
                        </p>
                    </div>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
