<!DOCTYPE html>

<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezervo | Ndreqe</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/pages/rezervo.css">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <div class="logo">
        <a href="./index.html">
          <img src="./assets/logos/logo.svg" alt="Ndreqe">
        </a>
        <h1>Ndreqe</h1>
      </div>

      <nav class="main-nav">
        <ul>
          <li><a href="./index.html">Shërbimet</a></li>
          <li><a href="./si-funksionon.html">Si funksionon</a></li>
          <li><a href="#">Për profesionistët</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a href="#">Kyçu</a>
        <a href="#formulari" class="btn-primary">Rezervo</a>
      </div>
    </div>
  </header>

  <main class="booking-page">

    <section class="services-overview-section" id="sherbimet">
      <h2>Shërbimet që ofrojmë</h2>

      <ul class="services-list">
        <li>Elektricist</li>
        <li>Hidraulik</li>
        <li>Pastrim</li>
        <li>Riparime shtëpiake</li>
      </ul>
    </section>

    <section class="booking-section" id="formulari">
      <h2>Rezervo shërbimin tënd</h2>
      <p>Plotëso të dhënat për të kërkuar një termin.</p>

      <form class="booking-form" action="#" method="get">

        <div class="form-group">
          <label for="emri">Emri dhe mbiemri</label>
          <input type="text" id="emri" name="emri" required>
        </div>

        <div class="form-group">
          <label for="telefoni">Numri i telefonit</label>
          <input type="tel" id="telefoni" name="telefoni" required>
        </div>

        <div class="form-group">
          <label for="sherbimi">Shërbimi</label>
          <select id="sherbimi" name="sherbimi" required>
            <option value="">Zgjedh shërbimin</option>
            <option value="elektricist">Elektricist</option>
            <option value="hidraulik">Hidraulik</option>
            <option value="pastrim">Pastrim</option>
            <option value="riparime">Riparime shtëpiake</option>
          </select>
        </div>

        <div class="form-group">
          <label for="qyteti">Qyteti</label>
          <input type="text" id="qyteti" name="qyteti" required>
        </div>

        <div class="form-group">
          <label for="data">Data e rezervimit</label>
          <input type="date" id="data" name="data" required>
        </div>

        <div class="form-group">
          <label for="ora">Ora e rezervimit</label>
          <input type="time" id="ora" name="ora" required>
        </div>
        
        <div class="form-group">
          <label for="adresa">Adresa</label>
          <input type="text" id="adresa" name="adresa" required>
        </div>

        <div class="form-group">
       <label for="mesazhi">Mesazh shtesë (opsionale)</label>
        <textarea
        id="mesazhi"
        name="mesazhi"
        rows="4"
        placeholder="A ke diçka tjetër për të shtuar?"
        ></textarea>
        </div>

        <button type="submit" class="btn-primary">
          Dërgo kërkesën
        </button>

      </form>
    </section>

  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; 2026 Ndreqe</p>
    </div>
  </footer>

</body>
</html>
